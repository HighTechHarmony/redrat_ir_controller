# RedRat IR Controller — runtime configuration

redrat:
  # Path to the LIRC chardev exposed by the kernel redrat3 driver.
  lirc_path: "/dev/lirc0"

flask:
  host: "0.0.0.0"
  port: 5000
  debug: false

storage:
  ir_codes: "config/ir_codes.yaml"
  macros: "config/macros.yaml"
  voice_commands: "config/voice_commands.yaml"

voice:
  # ALSA input device for the microphone.
  # Run `arecord -L` or `python -m sounddevice` to list available devices.
  # Use "hw:2,0" for the reSpeaker 2-mic HAT; "hw:3,0" for a USB mic.
  # Use "default" for the system default input device.
  alsa_device: "hw:2,0"

  # ALSA output device for beep/acknowledgement tones.
  # Use the shared ALSA mixer so simultaneous playback is mixed.
  speaker_device: "redrat_mixer"

  # ALSA output device for text-to-speech via espeak-ng.
  # Use the shared ALSA mixer to play alongside acknowledgement tones.
  tts_device: "redrat_mixer"
  tts_timeout_s: 30

  # openWakeWord model name (built-in) or path to a custom .onnx/.tflite file.
  # Built-in options usually include version suffixes like "hey_jarvis_v0.1".
  wake_word_model: "hey_jarvis_v0.1"

  # Detection score threshold (0.0–1.0). Lower = more sensitive but more false positives.
  # The "quiet mode" feature temporarily raises this to 0.99 for up to 4 hours.
  wake_word_threshold: 0.8

  # Path to the extracted Vosk model directory.
  vosk_model_path: "models/vosk-model-small-en-us-0.15"

  # Seconds to listen for a command after the wake word before giving up.
  command_timeout_s: 5

  # Minimum rapidfuzz token_set_ratio score (0–100) to accept a command match.
  command_match_threshold: 70

  # When true (default), voice commands can use short keyword-style phrases
  # like "projector on" — token_set_ratio will naturally match transcripts
  # like "turn on the projector" or "turn the projector on".
  # Set false if you prefer full-sentence phrases.
  fuzzy_match_voice_commands: true

  # Play a short beep when the wake word fires.
  beep_on_wake: true
  beep_freq_hz: 800
  beep_duration_s: 0.5

  # Debug/logging options.
  # NOTE: debug_audio=true with a low audio_log_every forces per-frame RMS
  # computation inside the real-time capture callback (even though the log
  # lines are suppressed at INFO level). Keep debug_audio=false and a higher
  # audio_log_every in normal operation to avoid CPU load / input overflows.
  debug_wake: false
  wake_log_every: 100
  debug_audio: false
  audio_log_every: 100
